name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Vet
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: ./build.sh
      - name: Size limit
        run: |
          for f in dist/SpaceHop-*.exe; do
            size=$(stat -c %s "$f"); echo "$f $size bytes"
            test "$size" -lt 10485760
          done
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceHop
          path: dist/

  selftest:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpaceHop
          path: dist
      - name: Run the program on a real desktop
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SpaceHop-amd64.exe -ArgumentList '--selftest', 'selftest-out' -Wait -PassThru
          if (Test-Path selftest-out\report.txt) { Get-Content selftest-out\report.txt -Encoding UTF8 }
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest-out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SpaceHop
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/SpaceHop-amd64.exe dist/SpaceHop-arm64.exe dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
